<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/eyenit_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WorkPulse — Everything Your Business Needs to Manage Its Workforce.</title>
    <meta name="description" content="WorkPulse — Everything Your Business Needs to Manage Its Workforce. Multi-tenant workforce management with automated 08:00 AM – 07:00 PM shifts, auto-finalized attendance, and seamless payroll processing." />
    <meta property="og:title" content="WorkPulse — Everything Your Business Needs to Manage Its Workforce." />
    <meta property="og:description" content="WorkPulse — Everything Your Business Needs to Manage Its Workforce. Multi-tenant workforce management with automated 08:00 AM – 07:00 PM shifts, auto-finalized attendance, and seamless payroll processing." />
    <script>
      (function () {
        try {
          var preference =
            localStorage.getItem("theme_preference") ||
            localStorage.getItem("eyenit_theme") ||
            "system";
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = preference === "dark" || (preference === "system" && systemDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
